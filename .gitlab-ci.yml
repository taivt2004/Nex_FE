# 3. Build APK Android (staging)
android_build_staging:
  stage: build
  script:
    - make apk-stg-split
    - curl -Lo firebase https://firebase.tools/bin/linux/latest
    - chmod +x firebase
    - APK_PATH=$(find build/app/outputs/flutter-apk -maxdepth 1 -name "*arm64-v8a*.apk" | head -n 1)
    - if [ -z "$APK_PATH" ]; then echo "KHÔNG TÌM THẤY FILE APK arm64-v8a"; ls -R build/app/outputs/flutter-apk || true; exit 1; fi
    - echo "Đang đẩy file $APK_PATH lên Firebase..."
    - ./firebase appdistribution:distribute "$APK_PATH" 
        --app "$FIREBASE_ANDROID_APP_ID_STAGING" 
        --token "$FIREBASE_TOKEN" 
        --groups "testers" 
        --release-notes "New staging build từ GitLab Runner"
        --non-interactive
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/*arm64-v8a*.apk
  only:
    - master

