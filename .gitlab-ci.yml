# 3. Build APK Android (staging)
android_build_staging:
  stage: build
  script:
    - make apk-stg-split
    - curl -Lo firebase https://firebase.tools/bin/linux/latest
    - chmod +x firebase
    - ./firebase appdistribution:distribute build/app/outputs/flutter-apk/*staging*arm64-v8a*.apk --app $FIREBASE_ANDROID_APP_ID_STAGING --token $FIREBASE_TOKEN --groups "testers" --release-notes "New staging build"
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/*staging*arm64-v8a*.apk
  only:
    - master

