# 3. Build APK Android (staging)
android_build_staging:
  stage: build
  script:
    # Build universal APK
    - make apk-stg
  artifacts:
    paths:
      # Lưu file APK lại để share cho stage sau
      - build/app/outputs/flutter-apk/app-staging-profile.apk
    expire_in: 1 hour
  # only:
  #   - master

# 4. Distribute to Firebase
android_distribute_staging:
  stage: distribution
  dependencies:
    - android_build_staging
  script:
    # 1. Cài Node.js 20 + npm
    - apt-get update && apt-get install -y curl
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
  
    # 2. Cài Firebase CLI
    - npm install -g firebase-tools

    # 3. File APK được lấy từ artifact của stage trước
    - APK_PATH="build/app/outputs/flutter-apk/app-staging-profile.apk"
    - echo "Đang đẩy file artifact $APK_PATH lên Firebase....."

    # 4. Distribute
    - firebase appdistribution:distribute "$APK_PATH" --app "$FIREBASE_ANDROID_APP_ID_STAGING" --token "$FIREBASE_TOKEN" --groups "testers" --release-notes "Bản build Universal Staging dùng Artifacts" --non-interactive
  # only:
  #   - master
  
