image: ghcr.io/cirruslabs/flutter:stable

stages:
  - quality    
  - verify     
  - build      

# 1. Scan code quality
static_analysis:
  stage: quality
  script:
    - make get
    - make analyze lib || true 

# 2. Verify unitest
unit_testing:
  stage: verify
  script:
  - echo "Đang bỏ qua unit test tạm thời"
    # - flutter test

# 3. Build APK Android (staging)
android_build_staging:
  stage: build
  script:
    - make apk-stg
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/*staging*.apk
  only:
    - master
