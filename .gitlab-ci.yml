# 3. Build APK Android (staging)
android_build_staging:
  stage: build
  script:
    # 1. Build universal APK (như mình đã thống nhất)
    - make apk-stg

    # 2. Cài Node.js 20 + npm (dùng NodeSource để tương thích firebase-tools v15)
    - apt-get update && apt-get install -y curl
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - node -v
    - npm -v

    # 3. Cài Firebase CLI qua npm
    - npm install -g firebase-tools

    # 4. Tìm file APK universal
    - APK_PATH=$(find build/app/outputs/flutter-apk -maxdepth 1 -name "app-staging-profile.apk" | head -n 1)
    - if [ -z "$APK_PATH" ]; then echo "KHÔNG TÌM THẤY FILE APK UNIVERSAL"; ls -R build/app/outputs/flutter-apk || true; exit 1; fi
    - echo "Đang đẩy file $APK_PATH lên Firebase....."
    - if [ -z "$FIREBASE_ANDROID_APP_ID_STAGING" ]; then echo "FIREBASE_ANDROID_APP_ID_STAGING chưa được cấu hình"; exit 1; fi
    - if [ -z "$FIREBASE_TOKEN" ]; then echo "FIREBASE_TOKEN chưa được cấu hình"; exit 1; fi
    - echo "App ID: $FIREBASE_ANDROID_APP_ID_STAGING"

    # 5. Dùng firebase CLI đã cài bằng npm.
    - firebase appdistribution:distribute "$APK_PATH" \
        --app "$FIREBASE_ANDROID_APP_ID_STAGING" \
        --token "$FIREBASE_TOKEN" \
        --groups "testers" \
        --release-notes "New staging build từ GitLab Runner" \
        --non-interactive \
        --debug
  only:
    - master

