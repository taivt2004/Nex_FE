image: ghcr.io/cirruslabs/flutter:stable

variables:
  # 1. Định nghĩa thư mục cache cho Flutter Pub
  PUB_CACHE: $CI_PROJECT_DIR/.pub-cache

# 2. Cấu hình Cache toàn cục
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pub-cache/
    - android/.gradle/wrapper/
    - android/.gradle/caches/

stages:
  - build
  - distribution

# 3. Build APK Android (staging)
android_build_staging:
  stage: build
  timeout: 3 hours
  before_script:
    - export PUB_CACHE=$CI_PROJECT_DIR/.pub-cache
    - flutter pub get
  script:
    - make apk-stg
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-staging-profile.apk
    expire_in: 1 hour

# 4. Distribute to Firebase
android_distribute_staging:
  stage: distribution
  # 5. TỐI ƯU QUAN TRỌNG: Dùng image Node.js nhẹ thay vì image Flutter nặng nề
  image: node:20-alpine 
  dependencies:
    - android_build_staging
  script:
    # Không cần cài Node.js nữa vì image đã có sẵn
    # Chỉ cần cài Firebase CLI
    - npm install -g firebase-tools

    - APK_PATH="build/app/outputs/flutter-apk/app-staging-profile.apk"
    - echo "Đang đẩy file artifact $APK_PATH lên Firebase....."

    - firebase appdistribution:distribute "$APK_PATH" --app "$FIREBASE_ANDROID_APP_ID_STAGING" --token "$FIREBASE_TOKEN" --groups "testers" --release-notes "Bản build Universal Staging dùng Artifacts" --non-interactive
