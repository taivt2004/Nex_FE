name: nexpaylab
description: NexPay mobile app
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  auto_size_text: ^3.0.0
  basic_utils: ^5.7.0
  bloc_concurrency: ^0.3.0
  cached_network_image: ^3.4.0
  crypto: ^3.0.7
  dartz: ^0.10.1
  dev: ^1.0.0
  dio: ^5.7.0
  dio_cache_interceptor: ^4.0.3
  drift: ^2.30.1
  drift_db_viewer: ^2.1.0
  equatable: ^2.0.5
  fl_chart: ^0.70.0
  flex_color_scheme: ^8.0.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.0.10+1
  font_awesome_flutter: ^10.8.0
  freezed: ^3.2.0
  freezed_annotation: ^3.1.0
  get_it: ^8.2.0
  go_router: ^16.2.1
  google_fonts: ^6.2.1
  injectable: ^2.4.4
  internet_connection_checker_plus: ^2.5.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  package_info_plus: ^9.0.0
  path: ^1.9.0
  path_provider: ^2.1.4
  pretty_dio_logger: ^1.4.0
  provider: ^6.1.2
  retrofit: ^4.4.1
  rxdart: ^0.28.0
  shared_preferences: ^2.3.2
  sqlcipher_flutter_libs: ^0.6.0
  sqlite3: ^2.9.0
  talker: ^5.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  build_runner: ^2.4.12
  drift_dev: ^2.30.1
  flutter_gen_runner: ^5.7.0
  flutter_launcher_icons: ^0.14.4
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  retrofit_generator: ^10.0.2 
  very_good_analysis: ^9.0.0

flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  assets:
    # outputs:
    #   style: snake-case
  integrations:
    flutter_svg: true

# make build
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/google_fonts/
    - assets/icons/
    - assets/icons/home/
    - assets/icons/home/bottom_menu/
    - assets/icons/home/action_btn/
    - assets/icons/home/crypt_actives/
    - assets/icons/home/topbar/
    - assets/icons/home/qrscan/
    - assets/images/
