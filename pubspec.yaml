name: nexpaylab
description: NexPay mobile app
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  auto_size_text: ^3.0.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_native_splash: ^2.4.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10+1
  freezed: ^3.2.0
  freezed_annotation: ^3.1.0
  get_it: ^8.2.0
  go_router: ^16.2.1
  google_fonts: ^6.2.1
  injectable: ^2.4.4
  intl: ^0.20.2
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.2
  talker: ^5.0.0
  drift: ^2.19.1+1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  dev: ^1.0.0
  drift_db_viewer: ^2.1.0

  cached_network_image: ^3.4.0
  url_launcher: ^6.3.1
  internet_connection_checker_plus: ^2.5.2
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.4.1
  basic_utils: ^5.7.0
  flutter_launcher_icons: ^0.14.1
  device_info_plus: ^11.5.0
  font_awesome_flutter: ^10.8.0
  provider: ^6.1.2
  dio_cache_interceptor: ^4.0.3
  flex_color_scheme: ^8.0.2
  rxdart: ^0.28.0

dev_dependencies:
  build_runner: ^2.4.12
  flutter_gen_runner: ^5.7.0
  drift_dev: ^2.19.1
  retrofit_generator: ^10.0.2 # for Dart 3.3 use ^9.0.0
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0

flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  assets:
    # outputs:
    #   style: snake-case
  integrations:
    flutter_svg: true

# make build
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/google_fonts/
    - assets/icons/
    - assets/icons/home/
    - assets/images/
